[project]
name = "chroma-walnut-ui"
version = "0.1.0"
description = "ChromaDB desktop client built with pywebview + React"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=0.6",
    "pywebview>=5",
    # 模板框架层依赖
    "aiosqlite>=0.22.1",
    "loguru>=0.7.0",
    "orjson>=3.9",
    # macOS WebKit backend
    "pyobjc-framework-Cocoa>=9; sys_platform == 'darwin'",
    "pyobjc-framework-WebKit>=9; sys_platform == 'darwin'",
    # Linux GTK backend（需要系统预先安装 libgirepository1.0-dev）
    "PyGObject>=3.42; sys_platform == 'linux'",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.20.0",
]
